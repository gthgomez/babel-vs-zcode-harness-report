name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-integrity:
    name: Report integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify FULL_REPORT.md is in sync with sources
        run: |
          bash scripts/assemble_full_report.sh
          if ! git diff --exit-code -- FULL_REPORT.md; then
            echo "::error::FULL_REPORT.md is stale. Run 'bash scripts/assemble_full_report.sh' and commit the result."
            exit 1
          fi

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            README.md
            reports/*.md
